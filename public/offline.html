<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070926" />
    <title>Offline — Bachelor Party</title>
    <!--
      Static, standalone and dependency-free on purpose: this is the only
      thing the service worker is allowed to serve from the cache, so it
      must not depend on the app's CSS bundle (which is not cached). The
      colours are the sRGB form of the same tokens in globals.css.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070926;
        color: #f7f4ea;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.5rem
          calc(2rem + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      .plate {
        background: #141b40;
        border-radius: 0.75rem;
        padding: 2rem 1.5rem;
        max-width: 22rem;
        box-shadow:
          inset 2px 2px 0 0 #9fb6f2,
          inset -2px -2px 0 0 #05061d,
          0 3px 0 0 #05061d;
      }
      h1 {
        font-family: "Arial Black", "Arial Bold", Helvetica, Arial, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 1.1rem;
        margin: 0 0 0.75rem;
        color: #f3b100;
      }
      p {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.5;
        color: #b9b8d6;
      }
      button {
        margin-top: 1.25rem;
        font: inherit;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        background: #f3b100;
        color: #2a1f00;
        border: 0;
        border-radius: 0.375rem;
        padding: 0.6rem 1.1rem;
        box-shadow: 0 3px 0 0 #05061d;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="plate">
        <h1>No signal</h1>
        <p>
          The scoreboard is live — it needs a connection to tell you anything true. Reconnect and try
          again.
        </p>
        <button type="button" onclick="location.reload()">Retry</button>
      </div>
    </main>
  </body>
</html>
