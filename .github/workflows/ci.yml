name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm's own "Exit handler never called!" bug (documented, triggered by
      # this repo's large number of optional platform-specific binaries —
      # @next/swc-*, @tailwindcss/oxide-*, lightningcss-*) hit both this CI
      # and Vercel reliably. pnpm handles optional deps differently and
      # doesn't hit it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
