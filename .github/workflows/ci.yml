name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Pin a known-good npm version. Node 22's bundled npm has been hitting
      # npm's own "Exit handler never called!" bug on this repo's install
      # (many optional platform-specific binaries — @next/swc-*,
      # @tailwindcss/oxide-*, lightningcss-* — is a documented trigger).
      - run: npm install -g npm@10.9.8
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
